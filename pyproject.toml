[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mle-eval"
version = "1.0.0"
description = "Extensible Benchmark Framework for Autonomous AI ML Engineering Agents"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0"
]

[project.scripts]
mle-eval = "src.cli:main"